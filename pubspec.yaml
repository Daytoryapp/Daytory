name: date_app
description: A Flutter dating log app with calendar and map views.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  intl: ^0.19.0
  table_calendar: ^3.1.2
  flutter_map: ^7.0.2
  flutter_map_marker_cluster: ^1.4.0
  latlong2: ^0.9.1
  uuid: ^4.5.1
  image_picker: ^1.1.2
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  cached_network_image: ^3.4.1
  path_provider: ^2.1.4
  geolocator: ^12.0.0
  kakao_flutter_sdk_user: ^1.9.0
  supabase_flutter: ^2.8.0
  flutter_dotenv: ^5.2.1
  firebase_core: ^3.12.0
  firebase_messaging: ^15.2.5
  flutter_local_notifications: ^18.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/images/
